<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cierre de Caja Diario</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { background: #ffffff; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
    
    /* Botón Ver Excel (Estilo secundario del mismo tono) */
    .btn-excel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background-color: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      margin-bottom: 22px;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-excel:hover { background-color: #e0e7ff; }

    h2 { color: #1e1b4b; text-align: center; margin-bottom: 22px; font-size: 22px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #374151; font-size: 14px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #d1d5db; border-radius: 10px; font-size: 16px; color: #1f2937; transition: border-color 0.2s; }
    input:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    
    /* Botón Guardar Registro (Mismo tono principal) */
    .btn-guardar { width: 100%; padding: 14px; background-color: #4f46e5; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
    .btn-guardar:hover { background-color: #4338ca; }
    .btn-guardar:disabled { background-color: #9ca3af; cursor: not-allowed; }
    
    #status { margin-top: 16px; text-align: center; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <a href="https://docs.google.com/spreadsheets/d/1crXBCJEicwDQ5vb3a174WOnhJBBw7pmQ5z_h0FMBOeU/edit?gid=0#gid=0" target="_blank" class="btn-excel">
    📊 Ver Excel / Hoja de Cálculo
  </a>

  <h2>📱 Cierre de Caja</h2>
  
  <form id="cajaForm">
    <div class="form-group">
      <label>👤 Nombre del Encargado</label>
      <input type="text" id="nombre" placeholder="Ej: Ana" required>
    </div>
    
    <div class="form-group">
      <label>💵 Dinero en Efectivo ($)</label>
      <input type="text" id="efectivo" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <div class="form-group">
      <label>💳 Dinero por Transferencias ($)</label>
      <input type="text" id="transferencias" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <div class="form-group">
      <label>📦 Dinero Retirado para Pedidos ($)</label>
      <input type="text" id="retiroPedidos" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <div class="form-group">
      <label>🚚 Valor Total Pedidos del Día ($)</label>
      <input type="text" id="totalPedidos" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <button type="submit" id="btnEnviar" class="btn-guardar">Guardar Registro</button>
  </form>
  
  <div id="status"></div>
</div>

<script>
  // URL DE TU SCRIPT DE GOOGLE APPS SCRIPT
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU2j79_ZOASm3BUUuKPnJWk4kA852pgdwYriSAUaAXsJrq20-9BwzgrK79VC8xbs1c/exec";

  // Formato con puntos de miles mientras se escribe
  document.querySelectorAll('.monto').forEach(input => {
    input.addEventListener('input', function(e) {
      let valor = e.target.value.replace(/\D/g, ''); 
      if (valor) {
        e.target.value = new Intl.NumberFormat('es-CO').format(valor); 
      } else {
        e.target.value = '';
      }
    });
  });

  // Limpiar puntos antes de enviar
  function limpiarNumero(val) {
    return val ? val.replace(/\./g, '') : '0';
  }

  // Guardar datos
  document.getElementById('cajaForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnEnviar');
    const status = document.getElementById('status');
    
    btn.disabled = true;
    btn.innerText = "Guardando...";
    status.innerText = "";

    const payload = {
      nombre: document.getElementById('nombre').value,
      efectivo: limpiarNumero(document.getElementById('efectivo').value),
      transferencias: limpiarNumero(document.getElementById('transferencias').value),
      retiroPedidos: limpiarNumero(document.getElementById('retiroPedidos').value),
      totalPedidos: limpiarNumero(document.getElementById('totalPedidos').value)
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      status.innerText = "✅ ¡Registrado con éxito!";
      status.style.color = "#4f46e5";
      document.getElementById('cajaForm').reset();
    })
    .catch(error => {
      status.innerText = "❌ Error al guardar datos.";
      status.style.color = "#dc2626";
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Guardar Registro";
    });
  });
</script>

</body>
</html>
