<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cierre de Caja Diario</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    
    /* Estilo del botón de Excel */
    .btn-excel {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #2980b9;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .btn-excel:hover { background-color: #1f618d; }

    h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    input:focus { border-color: #27ae60; outline: none; }
    
    .btn-guardar { width: 100%; padding: 14px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-guardar:hover { background-color: #219150; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <!-- BOTÓN PARA IR A GOOGLE SHEETS / EXCEL -->
  <a href="PEGA_AQUI_EL_ENLACE_DE_TU_HOJA_DE_EXCEL" target="_blank" class="btn-excel">
    📊 Ver Excel / Hoja de Cálculo
  </a>

  <h2>📱 Cierre de Caja</h2>
  
  <form id="cajaForm">
    <div class="form-group">
      <label>👤 Nombre del Encargado</label>
      <input type="text" id="nombre" placeholder="Ej: Ana" required>
    </div>
    
    <div class="form-group">
      <label>💵 Dinero en Efectivo ($)</label>
      <input type="text" id="efectivo" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <div class="form-group">
      <label>💳 Dinero por Transferencias ($)</label>
      <input type="text" id="transferencias" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <div class="form-group">
      <label>📦 Dinero Retirado para Pedidos ($)</label>
      <input type="text" id="retiroPedidos" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <div class="form-group">
      <label>🚚 Valor Total Pedidos del Día ($)</label>
      <input type="text" id="totalPedidos" class="monto" placeholder="0" inputmode="numeric" required>
    </div>
    
    <button type="submit" id="btnEnviar" class="btn-guardar">Guardar Registro</button>
  </form>
  
  <div id="status"></div>
</div>

<script>
  // URL DE TU SCRIPT DE GOOGLE APPS SCRIPT
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU2j79_ZOASm3BUUuKPnJWk4kA852pgdwYriSAUaAXsJrq20-9BwzgrK79VC8xbs1c/exec";

  // Formato con puntos de miles mientras se escribe
  document.querySelectorAll('.monto').forEach(input => {
    input.addEventListener('input', function(e) {
      let valor = e.target.value.replace(/\D/g, ''); 
      if (valor) {
        e.target.value = new Intl.NumberFormat('es-CO').format(valor); 
      } else {
        e.target.value = '';
      }
    });
  });

  // Limpiar puntos antes de enviar
  function limpiarNumero(val) {
    return val ? val.replace(/\./g, '') : '0';
  }

  // Guardar datos
  document.getElementById('cajaForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnEnviar');
    const status = document.getElementById('status');
    
    btn.disabled = true;
    btn.innerText = "Guardando...";
    status.innerText = "";

    const payload = {
      nombre: document.getElementById('nombre').value,
      efectivo: limpiarNumero(document.getElementById('efectivo').value),
      transferencias: limpiarNumero(document.getElementById('transferencias').value),
      retiroPedidos: limpiarNumero(document.getElementById('retiroPedidos').value),
      totalPedidos: limpiarNumero(document.getElementById('totalPedidos').value)
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      status.innerText = "✅ ¡Registrado con éxito!";
      status.style.color = "#27ae60";
      document.getElementById('cajaForm').reset();
    })
    .catch(error => {
      status.innerText = "❌ Error al guardar datos.";
      status.style.color = "red";
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Guardar Registro";
    });
  });
</script>

</body>
</html>
